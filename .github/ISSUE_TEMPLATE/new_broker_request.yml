name: New broker request
description: Ask for support for a broker that is not listed yet.
labels: [new-broker]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach a real statement.** Describe the layout or share a redacted
        sample only (see CONTRIBUTING.md).
  - type: input
    id: broker
    attributes:
      label: Broker name
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country / region of the account
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Statement type
      options: [PDF, CSV, Both]
    validations:
      required: true
  - type: textarea
    id: layout
    attributes:
      label: Redacted sample layout
      description: >
        Column headers, a few example rows for buys, sells, dividends, fees and
        deposits, and the date and number formats. Replace all personal data and
        change the amounts.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed all personal and account data from everything I posted here.
          required: true
