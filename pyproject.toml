[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statement2csv"
version = "0.1.0"
description = "Turn broker statements (PDF or CSV) into clean data for spreadsheets, taxes, and portfolio trackers like Wealthfolio and Ghostfolio. Fully offline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Xingjian Zhang" }]
keywords = [
    "wealthfolio", "ghostfolio", "broker", "statement", "pdf", "csv", "portfolio",
    "spreadsheet", "excel", "capital-gains", "fifo", "form-8949",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pdfplumber>=0.11",
    "typer>=0.12",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "reportlab>=4",
    "openpyxl>=3.1",
]

[project.scripts]
statement2csv = "statement2csv.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/statement2csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
